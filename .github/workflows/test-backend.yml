name: Backend CI
# Déclencheurs : Quand est-ce qu'on lance les tests ?
on:
  push:
    branches: [ "main", "master" ] # À chaque push sur la branche principale
  pull_request:
    branches: [ "main", "master" ] # À chaque Pull Request

jobs:
  test-backend:
    runs-on: ubuntu-latest

    # On lance un MongoDB temporaire pour les tests d'intégration
    services:
      mongo:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # GitHub récupère le code
    - name: Checkout code
      uses: actions/checkout@v3

    # Installation de Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Installation des librairies
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # On installe explicitement pytest si jamais il manque au requirements.txt
        pip install pytest pytest-asyncio httpx pyotp

    # Tests Unitaires
    - name: Run Unit Tests
      working-directory: ./backend
      run: python -m pytest tests/unit

    # Tests d'Intégration
    - name: Run Integration Tests
      working-directory: ./backend
      env:
        MONGO_DB_NAME: All_scans_TEST 
      run: python -m pytest tests/integration

    # Tests de Performance
    - name: Run Performance Tests
      working-directory: ./backend
      env:
        MONGO_DB_NAME: All_scans_TEST
      run: python -m pytest tests/performance
      